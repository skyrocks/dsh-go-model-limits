# @skyrocks/dsh-go-model-limits 插件行：作为 bundle patch 自动注入 profile 组合。
# 安装后由 `dsh plugin add` 的 reconcile 步骤登记为 profile layer，无需手改用户层。
- insert:
    - id: go-model-limits
      name: "@skyrocks/dsh-go-model-limits"
      config:
        docsUrl: https://opencode.ai/docs/console/go.md
        timeoutMs: 15000
        cacheMs: 21600000
