<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-label="模型选择列表中的 OpenCode GO 月度额度标签示意图">
  <title>模型选择列表中的 OpenCode GO 月度额度标签</title>
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .group { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; fill: #9aa0a6; }
      .name { font-size: 13.5px; fill: #1f2329; }
      .muted { font-size: 11px; fill: #9aa0a6; }
      .tag { font-size: 10.5px; fill: #8a8f98; }
      .caption { font-size: 11px; fill: #9aa0a6; }
    </style>
  </defs>

  <rect width="760" height="520" fill="#f6f7f9"/>

  <!-- menu card -->
  <rect x="100" y="34" width="560" height="424" rx="12" fill="#ffffff" stroke="#e6e8eb" filter="url(#card-shadow)"/>
  <text class="ui" x="124" y="64" font-size="13" font-weight="600" fill="#1f2329">选择模型</text>
  <text class="ui" x="636" y="64" text-anchor="end" font-size="11" fill="#9aa0a6">⌘ /</text>
  <line x1="100" y1="80" x2="660" y2="80" stroke="#f0f1f3"/>

  <!-- provider: opencode-go -->
  <text class="ui group" x="124" y="106">OPENCODE GO</text>
  <rect x="228" y="96" width="22" height="14" rx="4" fill="#eef2ff"/>
  <text class="ui" x="239" y="106" text-anchor="middle" font-size="9" font-weight="600" fill="#4d6bfe">GO</text>

  <!-- row 1: selected -->
  <rect x="112" y="114" width="536" height="36" rx="8" fill="#f5f7ff"/>
  <path d="M124 132l4 4 8-8" fill="none" stroke="#4d6bfe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="ui name" x="148" y="136.5">DeepSeek V4.1 Flash</text>
  <rect x="292" y="123" width="68" height="18" rx="5" fill="#ecfdf3"/>
  <text class="ui tag" x="326" y="135.5" text-anchor="middle" fill="#15803d">$100/月</text>

  <!-- row 2 -->
  <text class="ui name" x="148" y="174.5">GLM-5.3</text>
  <rect x="208" y="161" width="44" height="18" rx="5" fill="#fdf5e6"/>
  <text class="ui tag" x="230" y="173.5" text-anchor="middle" fill="#b45309">$15/月</text>

  <!-- row 3 -->
  <text class="ui name" x="148" y="212.5">GLM-5.3-Flash</text>
  <rect x="250" y="199" width="56" height="18" rx="5" fill="#eef2ff"/>
  <text class="ui tag" x="278" y="211.5" text-anchor="middle" fill="#2563eb">$60/月</text>

  <!-- row 4 -->
  <text class="ui name" x="148" y="250.5">Kimi K3</text>
  <rect x="208" y="237" width="44" height="18" rx="5" fill="#fdf5e6"/>
  <text class="ui tag" x="230" y="249.5" text-anchor="middle" fill="#b45309">$15/月</text>

  <!-- row 5 -->
  <text class="ui name" x="148" y="288.5">Beam Free</text>
  <rect x="222" y="275" width="36" height="18" rx="5" fill="#f5f1ff"/>
  <text class="ui tag" x="240" y="287.5" text-anchor="middle" fill="#7c3aed">无限</text>

  <line x1="112" y1="312" x2="648" y2="312" stroke="#f0f1f3"/>

  <!-- provider: official account (no tags) -->
  <text class="ui group" x="124" y="338">DEEPSEEK ACCOUNT</text>
  <text class="ui name" x="148" y="368.5">DeepSeek-V4.1-Flash</text>
  <text class="ui name" x="148" y="406.5">DeepSeek-V4-Pro</text>

  <text class="ui caption" x="100" y="486">示意图：额度只出现在 opencode-go 分组的模型行；官方账户等其他 provider 不受影响。</text>
  <text class="ui caption" x="100" y="506">颜色：<tspan fill="#b45309">＜$30 橙</tspan>　·　<tspan fill="#2563eb">$30–$99 蓝</tspan>　·　<tspan fill="#15803d">≥$100 绿</tspan>　·　<tspan fill="#7c3aed">无限 紫</tspan></text>
</svg>
